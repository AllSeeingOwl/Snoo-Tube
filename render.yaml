# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: snoo-tube
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@9 install --frozen-lockfile --prod
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
