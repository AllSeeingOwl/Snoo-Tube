<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snooker Tubey Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="A station tracker for the Snooker Tubey game.">
    <!-- Content Security Policy to prevent XSS and inline scripts -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <!-- iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snooker Tubey">
</head>
<body>
    <header>
        <h1>Snooker Tubey</h1>
        <div class="header-controls">
            <div class="tier-selector">
                <label for="game-tier">Tier:</label>
                <select id="game-tier">
                    <option value="Advanced">Advanced (1 use)</option>
                    <option value="Intermediate">Intermediate (2 uses)</option>
                    <option value="Casual">Casual (Unlimited)</option>
                </select>
            </div>
            <button id="wildcard-btn" class="wildcard-btn">🚇 Overground Wildcard</button>
            <button id="reset-btn" class="reset-btn">🔄 Reset Game</button>
        </div>
    </header>

    <main>
        <section class="search-section">
            <input type="search" id="search-input" placeholder="Search station, line, or colour... (Press '/')" aria-label="Search stations">
            <div class="filter-controls" role="group" aria-label="Station status filters">
                <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-btn" data-filter="unlocked" aria-pressed="false">Unlocked</button>
                <button class="filter-btn" data-filter="locked" aria-pressed="false">Locked</button>
            </div>
        </section>

        <section class="table-container">
            <table id="stations-table">
                <thead>
                    <tr>
                        <th scope="col">Station</th>
                        <th scope="col">Lines</th>
                        <th scope="col" class="col-colours">Colours</th>
                        <th scope="col">Zone</th>
                        <th scope="col">Used</th>
                    </tr>
                </thead>
                <tbody id="stations-body">
                    <!-- Stations will be populated here by JavaScript -->
                    <tr><td colspan="5" class="loading-message">Loading stations...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Modal for Wildcard Selection -->
    <div id="wildcard-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="wildcard-modal-title">
        <div class="modal-content">
            <button class="close-btn" aria-label="Close modal">&times;</button>
            <h2 id="wildcard-modal-title">Overground Wildcard</h2>
            <p>Select a previously used station to unlock:</p>
            <input type="search" id="wildcard-search" placeholder="Search locked stations..." aria-label="Search locked stations">
            <ul id="locked-stations-list">
                <!-- Locked stations will populate here -->
            </ul>
            <button id="cancel-wildcard-btn" class="secondary-btn">Cancel</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden" role="alert" aria-live="assertive"></div>

    <script src="js/app.js"></script>
</body>
</html>
