<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tubey Games Hub</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { margin-bottom: 2rem; }
        .menu { display: flex; gap: 2rem; }
        .card { background: #333; padding: 2rem; border-radius: 8px; text-decoration: none; color: white; text-align: center; transition: transform 0.2s; width: 200px; }
        .card:hover { transform: scale(1.05); background: #444; }
        .card h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Select Your Game</h1>
    <div class="menu" style="flex-wrap: wrap; justify-content: center; max-width: 800px;">
        <a href="/snooker" class="card">
            <h2>Snooker Tubey</h2>
            <p>London Underground & Snooker rules.</p>
        </a>
        <a href="/pool" class="card">
            <h2>Pool Subway</h2>
            <p>New York Subway & 8-Ball rules.</p>
        </a>
        <a href="/paris" class="card">
            <h2>Paris Pool</h2>
            <p>Paris Metro & 8-Ball rules.</p>
        </a>
        <a href="/tokyo-snooker" class="card">
            <h2>Tokyo Snooker</h2>
            <p>Tokyo Subway & Snooker rules.</p>
        </a>
        <a href="/tokyo-pool" class="card">
            <h2>Tokyo Pool</h2>
            <p>Tokyo Subway & 8-Ball rules.</p>
        </a>
    </div>
</body>
</html>
